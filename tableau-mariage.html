<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau Mariage — Ivan & Alessia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFF8F3;--warm:#F5EDE6;--sepia:#7A6248;--sepia-light:#A8906E;
  --dark:#000000;--mid:#6E6060;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',sans-serif;
  --border:rgba(122,98,72,0.18);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--dark);font-family:var(--sans);font-weight:300;min-height:100vh}

.layout{
  display:grid;grid-template-columns:340px 1fr;gap:2.5rem;
  max-width:1400px;margin:0 auto;padding:2.5rem 3rem 3rem;align-items:start;
}

.left-panel{display:flex;flex-direction:column;gap:1.25rem;position:sticky;top:2.5rem}

.page-title{margin-bottom:1.5rem}
.page-title .sub{font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:var(--sepia);font-weight:500;margin-bottom:0.6rem}
.page-title h1{font-family:var(--serif);font-size:clamp(2.2rem,5vw,3.5rem);font-weight:300;line-height:1.1;color:var(--dark)}
.page-title h1 em{font-style:italic;color:var(--sepia)}

.search-wrap{position:relative}
.search-wrap input{
  width:100%;padding:0.75rem 2.5rem 0.75rem 1rem;
  background:var(--warm);border:1px solid var(--border);border-radius:2px;
  font-family:var(--sans);font-size:14px;font-weight:300;color:var(--dark);
  outline:none;transition:border-color 0.2s;-webkit-appearance:none;appearance:none;
}
.search-wrap input::placeholder{color:var(--mid)}
.search-wrap input:focus{border-color:var(--sepia)}
.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sepia-light);pointer-events:none}
.search-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.result-banner{
  background:var(--warm);border:1px solid var(--border);border-left:3px solid var(--sepia);
  border-radius:2px;padding:0.85rem 1rem;display:none;align-items:flex-start;gap:10px;
}
.result-banner.visible{display:flex}
.rb-check{color:var(--sepia);font-size:16px;flex-shrink:0;margin-top:1px}
.rb-text{flex:1;font-size:13px;color:var(--mid);line-height:1.5}
.rb-text strong{color:var(--dark);font-weight:500;display:block;font-size:14px}
.rb-text span{font-size:12px}
.rb-clear{background:none;border:none;cursor:pointer;color:var(--mid);font-size:16px;padding:0;line-height:1;flex-shrink:0;transition:color 0.2s}
.rb-clear:hover{color:var(--dark)}

.tables-list{display:flex;flex-direction:column}
.table-item{border-bottom:1px solid rgba(122,98,72,0.12)}
.table-item:first-child{border-top:1px solid rgba(122,98,72,0.12)}
.table-header{display:flex;align-items:center;padding:0.85rem 0;cursor:pointer;transition:color 0.2s;user-select:none;gap:0.75rem}
.table-header:hover .table-name{color:var(--sepia)}
.table-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--sepia);font-weight:500;min-width:32px;flex-shrink:0}
.table-name{font-family:var(--serif);font-size:1.05rem;font-weight:400;color:var(--dark);flex:1;transition:color 0.2s}
.table-count{font-size:11px;color:var(--mid);flex-shrink:0}
.table-chevron{color:var(--sepia-light);transition:transform 0.25s;flex-shrink:0}
.table-chevron svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.table-item.open .table-chevron{transform:rotate(180deg)}
.table-item.active .table-name{color:var(--sepia)}
.table-item.active .table-label{color:var(--dark)}

.guests-list{max-height:0;overflow:hidden;transition:max-height 0.32s ease;padding-left:44px}
.table-item.open .guests-list{max-height:700px}
.guest-row{
  padding:0.32rem 0;border-bottom:1px solid rgba(122,98,72,0.07);
  font-size:13px;color:var(--mid);line-height:1.4;display:flex;align-items:center;gap:6px;
}
.guest-row:last-child{border-bottom:none;padding-bottom:0.7rem}
.guest-row.highlight{color:var(--dark);font-weight:500}
.guest-row.highlight::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--sepia);flex-shrink:0}

/* MAP — nessun bordo */
.map-wrap{position:relative;width:100%;border-radius:4px;overflow:hidden}
.map-wrap img{width:100%;display:block}
.map-wrap svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;padding:1.5rem}
  .left-panel{position:static}
}
</style>
</head>

      <h1>Tableau <em>Mariage</em></h1>
    </div>
    <div class="search-wrap">

    <div class="result-banner" id="resultBanner">

          <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#D4A843"/>
          </marker>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="tablesGroup" style="pointer-events:all"></g>
        <g id="arrowGroup" style="display:none">
          <line id="arrowLine" stroke="#D4A843" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#ah)" opacity="0.92"/>
          <circle id="arrowTarget" r="36" fill="rgba(212,168,67,0.15)" stroke="#D4A843" stroke-width="2" filter="url(#glow)"/>
        </g>
      </svg>
    </div>
  </div>
</div>

<script>
// Coordinate misurate pixel-perfect sull'immagine 1254x1254 tramite scipy blob detection,
// scalate al viewBox 900x900. RGB campionato al centro: tutti beige/crema caldi confermati.
const TABLES = [
  {id:1,  label:"T01", name:"Tavolo Alpha",  x:346, y:137},
  {id:2,  label:"T02", name:"Tavolo Beta",   x:546, y:134},
  {id:3,  label:"T03", name:"Tavolo Gamma",  x:205, y:198},

  {id:5,  label:"T05", name:"Tavolo Salla",  x:178, y:345},

  {id:7,  label:"T07", name:"Tavolo Balla",  x:188, y:504},
  {id:8,  label:"T08", name:"Tavolo Prova",  x:709, y:504},
  {id:9,  label:"T09", name:"Tavolo Vares",  x:221, y:623},
  {id:10, label:"T10", name:"Tavolo Milano", x:347, y:619},
];

const GUESTS = [
  {n:"Fausto Avitabile",t:1},{n:"Carolina Abagnale",t:1},{n:"Antonio Pio Avitabile",t:1},
  {n:"Ludovico Avitabile",t:1},{n:"Antonella Toniolo",t:1},{n:"Letizia Avitabile",t:1},
  {n:"Chiara Avitabile",t:1},{n:"Karim Zarfaoui",t:1},{n:"Luigi Avitabile",t:1},{n:"Regina Abagnale",t:1},
  {n:"Mario Romano",t:2},{n:"Chiara Romano",t:2},{n:"Antonio Romano",t:2},{n:"Anna Abagnale",t:2},
  {n:"Ugo Caiazzo",t:2},{n:"Nicola Caiazzo",t:2},{n:"Alfonso Caiazzo",t:2},
  {n:"Alessandro Caiazzo",t:2},{n:"Giuseppe Abagnale",t:2},
  {n:"Angela Martone",t:3},{n:"Elisabetta Abagnale",t:3},{n:"Arianna Abagnale",t:3},
  {n:"Rossella Abagnale",t:3},{n:"Davide Calabrese",t:3},{n:"Eva Calabrese",t:3},
  {n:"Giovanni Calabrese",t:3},{n:"Ausilia Mascolo",t:3},{n:"Gerardo Todisco",t:3},{n:"Paola Todisco",t:3},
  {n:"Daniela Todisco",t:4},{n:"Chiara Todisco",t:4},{n:"Liana Ruotolo",t:4},
  {n:"Ezechiele Marotta",t:4},{n:"Emilio Marotta",t:4},{n:"Arianna Marotta",t:4},
  {n:"Raffaele Schettino",t:4},{n:"Alessandra Alfieri",t:4},{n:"Giovanni Schettino",t:4},
  {n:"Paola Flavia Schettino",t:5},{n:"Emanuela Schettino",t:5},{n:"Stefano De Santis",t:5},
  {n:"Anna Rosanova",t:5},{n:"Vincent De Santis",t:5},{n:"Mario De Santis",t:5},
  {n:"Sabina Cariello",t:5},{n:"Goffredo Alloro",t:5},{n:"Anna Alloro",t:5},{n:"Alfonso Alloro",t:5},
  {n:"Mauro Salodini",t:6},{n:"Caterina Zangari",t:6},{n:"Milos Salodini",t:6},
  {n:"Maria Pia Sandona",t:6},{n:"Pasquale Zangari",t:6},{n:"Francesca Zangari",t:6},
  {n:"Melissa Zangari",t:6},{n:"Loris Zangari",t:6},{n:"Samuele Zangari",t:6},{n:"Claudia Pozzato",t:6},
  {n:"Ginevra Zangari",t:7},{n:"Immacolata Zangari",t:7},{n:"Giuseppe Piscopiello",t:7},
  {n:"Moreno Piscopiello",t:7},{n:"Alessandra Panico",t:7},{n:"Maria Piscopiello",t:7},
  {n:"Marco Piscopiello",t:7},{n:"Eros Piscopiello",t:7},{n:"Ilaria Greco",t:7},{n:"Rachele Piscopiello",t:7},
  {n:"Mattia Piscopiello",t:8},{n:"Miriam Piscopiello",t:8},{n:"Elena Piscopiello",t:8},
  {n:"Antonella Brunello",t:8},{n:"Leonildo Bassan",t:8},{n:"Angeliva Brunello",t:8},
  {n:"Giorgio Fiorese",t:8},{n:"Eleonora Salodini",t:8},{n:"Nicola Pagani",t:8},{n:"Adam Casella",t:8},
  {n:"Giammarco Ariozzi",t:9},{n:"Benedetta Mineo",t:9},{n:"Alessandro Stecchi",t:9},
  {n:"Alice Miscali",t:9},{n:"Deborah Buonafine",t:9},{n:"Simone Napolitano",t:9},
  {n:"Marta D'Antimo",t:9},{n:"Giuseppe De Martino",t:9},{n:"Rosita D'Aniello",t:9},{n:"Andrea Palumbo",t:9},
  {n:"Maria Di Maio",t:10},{n:"Francesco Lotti",t:10},{n:"Margherita Vitali",t:10},
  {n:"Andrea Sesta",t:10},{n:"Mario Tedesco",t:10},{n:"Eleonora Silveri",t:10},
  {n:"Doriana Cottone",t:10},{n:"Marco D'Amico",t:10},{n:"Fabiana Cottone",t:10},
];

const guestsByTable = {};
TABLES.forEach(t => guestsByTable[t.id] = []);
GUESTS.forEach(g => guestsByTable[g.t].push(g.n));

const svgNS = 'http://www.w3.org/2000/svg';
let activeTableId = null;
let animFrame = null, pulseDir = 1, pulseR = 36;

function normalize(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9 ]/g,' ').trim();
}
function matchesQuery(fullName, query){
  if(!query) return true;
  const np = normalize(fullName).split(/\s+/).filter(Boolean);
  const qp = normalize(query).split(/\s+/).filter(Boolean);
  return qp.every(q => np.some(n => n.startsWith(q)));
}

function buildTablesList(q){
  const list = document.getElementById('tablesList');
  list.innerHTML = '';
  TABLES.forEach(t => {
    const all = guestsByTable[t.id];
    const matching = q ? all.filter(n => matchesQuery(n,q)) : all;
    if(q && matching.length === 0) return;
    const item = document.createElement('div');
    const isActive = t.id === activeTableId;
    const shouldOpen = q ? matching.length > 0 : isActive;
    item.className = 'table-item' + (isActive?' active':'') + (shouldOpen?' open':'');
    item.dataset.id = t.id;
    item.innerHTML = `
      <div class="table-header" onclick="toggleTable(${t.id})">
        <span class="table-label">${t.label}</span>
        <span class="table-name">${t.name}</span>
        <span class="table-count">${all.length}</span>
        <span class="table-chevron"><svg viewBox="0 0 14 14"><path d="M2 4l5 5 5-5"/></svg></span>
      </div>
      <div class="guests-list">
        ${matching.map(n=>`<div class="guest-row${q?' highlight':''}">${n}</div>`).join('')}
      </div>`;
    list.appendChild(item);
  });
}

function toggleTable(id){
  const item = document.querySelector(`.table-item[data-id="${id}"]`);
  if(!item) return;
  const wasOpen = item.classList.contains('open');
  document.querySelectorAll('.table-item').forEach(el=>el.classList.remove('open'));
  if(!wasOpen) item.classList.add('open');
  selectTable(id);
}

function selectTable(id){
  activeTableId = id;
  drawTables(id);
  document.querySelectorAll('.table-item').forEach(el=>
    el.classList.toggle('active', parseInt(el.dataset.id)===id));
  const t = TABLES.find(t=>t.id===id);
  if(t) animateArrow(t.x, t.y);
}

function onSearch(){
  const val = document.getElementById('searchInput').value;
  buildTablesList(val);
  const q = val.trim();
  if(q.length < 2){ hideBanner(); return; }
  for(const g of GUESTS){
    if(matchesQuery(g.n, q)){
      const t = TABLES.find(t=>t.id===g.t);
      showBanner(g.n, t);
      selectTable(t.id);
      const item = document.querySelector(`.table-item[data-id="${t.id}"]`);
      if(item) item.classList.add('open');
      return;
    }
  }
  hideBanner();
}

function showBanner(name, table){
  document.getElementById('resultText').innerHTML =
    `<strong>${name}</strong><span>${table.label} &middot; ${table.name}</span>`;
  document.getElementById('resultBanner').classList.add('visible');
}
function hideBanner(){
  document.getElementById('resultBanner').classList.remove('visible');
}
function reset(){
  document.getElementById('searchInput').value='';
  hideBanner();
  activeTableId=null;
  buildTablesList('');
  drawTables(null);
  hideArrow();
}

function drawTables(activeId){
  const g = document.getElementById('tablesGroup');
  g.innerHTML='';
  TABLES.forEach(t=>{
    const tg = document.createElementNS(svgNS,'g');
    tg.style.cursor='pointer';
    tg.onclick=()=>toggleTable(t.id);
    const isActive = t.id===activeId;
    if(isActive){
      const gl=document.createElementNS(svgNS,'circle');
      gl.setAttribute('cx',t.x);gl.setAttribute('cy',t.y);gl.setAttribute('r','44');
      gl.setAttribute('fill','rgba(212,168,67,0.2)');
      gl.setAttribute('stroke','rgba(212,168,67,0.55)');gl.setAttribute('stroke-width','1.5');
      tg.appendChild(gl);
    }
    const badge=document.createElementNS(svgNS,'rect');
    badge.setAttribute('x',t.x-21);badge.setAttribute('y',t.y-11);
    badge.setAttribute('width',42);badge.setAttribute('height',22);badge.setAttribute('rx',11);
    badge.setAttribute('fill',isActive?'#D4A843':'rgba(10,6,2,0.72)');
    badge.setAttribute('stroke',isActive?'#a07820':'rgba(212,168,67,0.45)');
    badge.setAttribute('stroke-width',isActive?'1.5':'0.8');
    tg.appendChild(badge);
    const lbl=document.createElementNS(svgNS,'text');
    lbl.setAttribute('x',t.x);lbl.setAttribute('y',t.y+4);
    lbl.setAttribute('text-anchor','middle');lbl.setAttribute('font-size','10.5');
    lbl.setAttribute('font-weight','500');lbl.setAttribute('font-family','Jost,sans-serif');
    lbl.setAttribute('fill',isActive?'#2a1600':'#f0dba0');
    lbl.textContent=t.label;
    tg.appendChild(lbl);
    g.appendChild(tg);
  });
}

// Ingresso: centro del corridoio in basso — orig ~(627,940) → viewBox ~(450,847)
function animateArrow(tx,ty){
  if(animFrame) cancelAnimationFrame(animFrame);
  const ag=document.getElementById('arrowGroup');
  const al=document.getElementById('arrowLine');
  const at=document.getElementById('arrowTarget');
  ag.style.display='';
  const sx=450,sy=847;let p=0;
  function step(){
    p=Math.min(p+0.024,1);
    const e=1-Math.pow(1-p,4);
    const cx=sx+(tx-sx)*e,cy=sy+(ty-sy)*e;
    al.setAttribute('x1',sx);al.setAttribute('y1',sy);
    al.setAttribute('x2',cx);al.setAttribute('y2',cy);
    at.setAttribute('cx',cx);at.setAttribute('cy',cy);
    if(p<1) animFrame=requestAnimationFrame(step);
    else pulseAnim();
  }
  requestAnimationFrame(step);
}
function pulseAnim(){
  const at=document.getElementById('arrowTarget');
  function pulse(){
    pulseR+=pulseDir*0.28;
    if(pulseR>42)pulseDir=-1;if(pulseR<29)pulseDir=1;
    at.setAttribute('r',pulseR);animFrame=requestAnimationFrame(pulse);
  }
  pulse();
}
function hideArrow(){
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
  document.getElementById('arrowGroup').style.display='none';
  pulseR=36;pulseDir=1;
}

buildTablesList('');
drawTables(null);
</script>
</body>
</html>
