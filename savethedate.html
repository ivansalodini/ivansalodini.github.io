<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save the Date — Ivan & Alessia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; min-height: 100vh;
    background: #FAF8F4;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── CARD ─────────────────────────────────────────────── */
  .card {
    width: min(420px, 90vw);
    aspect-ratio: 210 / 297;
    background: #FAF8F4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 12% 8% 10%;
  }

  /* ── TOP: SAVE the DATE ─────────────────────────────── */
  .card-top { text-align: center; line-height: 1; }

  .word-save,
  .word-date {
    display: block;
    font-family: 'Cormorant SC', serif;
    font-weight: 300;
    font-size: 67.4px;
    letter-spacing: 0.04em;
    color: #9B8B7A;
    line-height: 1;
    opacity: 0;
  }

  .word-the {
    display: block;
    font-family: 'Slight', cursive;
    font-size: 33.9px;
    color: #9B8B7A;
    line-height: 1.3;
    font-weight: 400;
    opacity: 0;
  }

  /* ── BOTTOM DETAILS ─────────────────────────────────── */
  .card-bottom {
    text-align: center;
    width: 100%;
    opacity: 0;
  }

  .detail-date {
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    font-weight: 400;
    font-style: normal;
    letter-spacing: 0.18em;
    color: #9B8B7A;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .detail-names {
    font-family: 'EB Garamond', serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.22em;
    color: #9B8B7A;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .detail-place {
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    font-style: italic;
    font-weight: 400;
    color: #9B8B7A;
    margin-bottom: 20px;
  }

  .detail-rule {
    width: 44px; height: 1px;
    background: #9B8B7A;
    margin: 0 auto 20px;
    opacity: 0.5;
    transform: scaleX(0);
    transform-origin: center;
  }

  .detail-invite {
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    font-style: italic;
    font-weight: 400;
    color: #9B8B7A;
  }

  /* ── ANIMATIONS ─────────────────────────────────────── */
  .word-save {
    animation: wordUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
  }
  .word-the {
    animation: scriptIn 1.3s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;
  }
  .word-date {
    animation: wordUp 1.1s cubic-bezier(0.16,1,0.3,1) 1.4s forwards;
  }
  .card-bottom {
    animation: bottomUp 1.2s cubic-bezier(0.16,1,0.3,1) 2.1s forwards;
  }
  .detail-rule {
    animation: ruleIn 0.9s ease 2.9s forwards;
  }

  @keyframes wordUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes scriptIn {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes bottomUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes ruleIn {
    to { transform: scaleX(1); }
  }

  /* ── SITE LINK ──────────────────────────────────────── */
  .site-link {
    position: fixed; bottom: 22px; left: 0; right: 0;
    text-align: center;
    opacity: 0;
    animation: bottomUp 1s ease 3.4s forwards;
  }
  .site-link a {
    font-family: 'EB Garamond', serif;
    font-size: 12px; font-weight: 400;
    letter-spacing: 0.2em;
    color: rgba(155,139,122,0.5);
    text-decoration: none;
    border-bottom: 1px solid rgba(155,139,122,0.2);
    padding-bottom: 2px;
    transition: color 0.2s, border-color 0.2s;
  }
  .site-link a:hover { color: #9B8B7A; border-color: #9B8B7A; }
  @font-face {
    font-family: 'Slight';
    src: url('Slight.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-top">
    <span class="word-save">SAVE</span>
    <span class="word-the">the</span>
    <span class="word-date">DATE</span>
  </div>
  <div class="card-bottom">
    <div class="detail-date">12 Giugno 2027</div>
    <div class="detail-names">Ivan &amp; Alessia</div>
    <div class="detail-place">Varese</div>
    <div class="detail-rule"></div>
    <div class="detail-invite">Invito a seguire</div>
  </div>
</div>

<div class="site-link">
  <a href="https://ivanalessia.com">ivanalessia.com</a>
</div>

</body>
</html>
